services:
  prossima:
    build:
      context: .
      target: servizio
    restart: unless-stopped
    # Python come PID 1 ignora SIGTERM (il kernel non applica l'azione predefinita
    # al PID 1 di un container): `docker compose stop` aspetterebbe 10 secondi e
    # poi ucciderebbe il processo. Con un init il segnale arriva a Python, che
    # termina subito: lo stato si recupera a ogni riavvio (spec §4).
    init: true
    env_file: ./config/prossima.env
    volumes:
      - ./dati:/data
      - ./config:/config:ro
    # Il container non cambia niente fuori da /data e /tmp, non ha privilegi da
    # guadagnare, e non si porta dietro la macchina se qualcosa va storto.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    # Il log di Docker non cresce senza fine: tre file da 10 MB al massimo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Nessuna porta: il bot chiama Telegram, nessuno chiama il bot.

  prova:
    profiles: ["prova"]
    build:
      context: .
      target: prova
    env_file: ./config/prossima.env
    volumes:
      - ./dati:/data
      - ./config:/config:ro
